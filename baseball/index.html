<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全力プロ野球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen night-game "TV broadcast" canvas with a control deck under it. Single dark world by design. */
:root{
  --night:#0c1736; --deck:#15245a; --line:#2b3f85; --chalk:#f3f6ff; --dim:#9fb0de;
  --yolk:#ffd23f; --red:#e8364a; --blue:#2f6fe0;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--body);margin:0;
  background-image:radial-gradient(120% 60% at 50% -10%,#24408f 0%,transparent 60%)}
.wrap{max-width:500px;margin:0 auto;padding-inline:16px;padding-block:10px 24px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-size:1.5rem;letter-spacing:.04em;margin:0;line-height:1;
  color:var(--yolk);text-shadow:2px 2px 0 var(--red),4px 4px 0 #000;transform:skewX(-8deg)}
.icon-btn{font:700 .8rem var(--body);color:var(--chalk);background:var(--deck);border:2px solid var(--line);
  border-radius:999px;padding:6px 12px;cursor:pointer}
.screen{position:relative;width:100%;aspect-ratio:3/4;max-width:100%;border-radius:14px;overflow:hidden;
  background:#000;border:3px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5)}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:20px 18px;background:linear-gradient(180deg,rgba(12,23,54,.88),rgba(12,23,54,.96));text-align:center;overflow-y:auto}
.big-title{font-family:var(--display);font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;margin:0;color:var(--yolk);
  text-shadow:3px 3px 0 var(--red),6px 6px 0 #000;transform:skewX(-8deg);text-wrap:balance}
.tag{font-size:.8rem;color:var(--dim);letter-spacing:.12em;margin:0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;width:100%;max-width:360px}
.team{border-radius:10px;padding:8px 6px;border:2px solid var(--line);background:var(--deck);min-width:0}
.team b{display:block;font-family:var(--display);font-weight:400;font-size:.95rem}
.team span{display:block;font-size:.7rem;color:var(--dim);margin-top:2px}
.team.you{border-color:var(--blue)}
.vs i{font-family:var(--display);font-style:normal;color:var(--yolk)}
.opts{display:flex;flex-direction:column;gap:8px;width:100%;max-width:360px}
.seg{display:flex;gap:6px;align-items:center}
.seg>span{font-size:.75rem;color:var(--dim);width:4.5em;text-align:left;letter-spacing:.06em}
.seg button{flex:1;font:700 .85rem var(--body);color:var(--chalk);background:transparent;border:2px solid var(--line);
  border-radius:8px;padding:6px 0;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--yolk);color:#1a1a1a;border-color:var(--yolk)}
.play{font-family:var(--display);font-size:1.3rem;color:#1a1a1a;background:var(--yolk);border:0;border-radius:12px;
  padding:12px 34px;cursor:pointer;box-shadow:0 5px 0 #b8901a;transform:skewX(-6deg)}
.play:active{transform:skewX(-6deg) translateY(3px);box-shadow:0 2px 0 #b8901a}
.howto{font-size:.75rem;color:var(--dim);line-height:1.7;margin:0;max-width:34em}
.howto kbd{font-family:var(--body);font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--chalk)}
.deck{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:stretch}
.ptypes{flex:1.6;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;min-width:0}
.ptypes button,.toggle{font:800 .8rem var(--body);color:var(--chalk);background:var(--deck);border:2px solid var(--line);
  border-radius:10px;padding:8px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptypes button[aria-pressed="true"]{border-color:var(--yolk);color:var(--yolk);background:#22306a}
.ptypes small{font-weight:700;opacity:.85;margin-left:2px}
.toggle{flex:0 0 7.5em}
.toggle[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.big{flex:1;font-family:var(--display);font-size:1.25rem;color:#1a1a1a;background:var(--yolk);border:0;border-radius:12px;
  padding:14px 10px;cursor:pointer;box-shadow:0 5px 0 #b8901a;touch-action:manipulation}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #b8901a}
.big:disabled{opacity:.45}
.help{font-size:.75rem;color:var(--dim);margin:0;line-height:1.6}
button:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.result-title{font-family:var(--display);font-size:2.6rem;margin:0;transform:skewX(-8deg);text-shadow:3px 3px 0 #000}
.scroll-x{overflow-x:auto;max-width:100%}
table.line{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.85rem}
table.line th,table.line td{border:1px solid var(--line);padding:4px 7px;text-align:center}
table.line th{color:var(--dim);font-weight:700}
table.line td.tot{color:var(--yolk);font-weight:800}
table.stats{border-collapse:collapse;font-size:.75rem;font-variant-numeric:tabular-nums}
table.stats td,table.stats th{padding:2px 8px;text-align:left;border-bottom:1px solid var(--line)}
table.stats th{color:var(--dim);font-weight:700}
@media (prefers-reduced-motion: reduce){.play,.big{transition:none}}
</style>

<div class="wrap">
  <header>
    <p class="logo">全力プロ野球</p>
    <button class="icon-btn" id="btnSound" aria-pressed="true">音 ON</button>
  </header>

  <div class="screen">
    <canvas id="cv" width="480" height="640" aria-label="野球の試合画面"></canvas>

    <div class="overlay" id="title">
      <p class="tag">NIGHT GAME ・ 全力スタジアム</p>
      <h1 class="big-title">全力<br>プロ野球</h1>
      <div class="vs">
        <div class="team"><b>夕焼けレイヴンズ</b><span>先攻 ・ CPU</span></div>
        <i>VS</i>
        <div class="team you"><b>青空シャークス</b><span>後攻 ・ あなた</span></div>
      </div>
      <div class="opts">
        <div class="seg" id="optInn"><span>イニング</span>
          <button type="button" id="inn1" data-v="1" aria-pressed="false">1回</button>
          <button type="button" id="inn3" data-v="3" aria-pressed="true">3回</button>
          <button type="button" id="inn9" data-v="9" aria-pressed="false">9回</button>
        </div>
        <div class="seg" id="optDiff"><span>難易度</span>
          <button type="button" id="dEasy" data-v="easy" aria-pressed="false">かんたん</button>
          <button type="button" id="dNorm" data-v="normal" aria-pressed="true">ふつう</button>
          <button type="button" id="dHard" data-v="hard" aria-pressed="false">つよい</button>
        </div>
      </div>
      <button class="play" id="btnPlay" type="button">プレイボール！</button>
      <p class="howto">
        <b>打撃</b>：マウス移動 / ドラッグ / <kbd>←↑↓→</kbd> でミートカーソルを動かし、<kbd>クリック</kbd> / <kbd>Space</kbd> / スイングボタンで打つ。<kbd>Shift</kbd> で強振（カーソル小・パワー大）。<br>
        <b>投球</b>：<kbd>1</kbd>〜<kbd>4</kbd> で球種を選び、カーソルで狙ってから投げる。
      </p>
    </div>

    <div class="overlay" id="over" hidden></div>
  </div>

  <div class="deck" id="deck" hidden>
    <div class="row" id="batRow">
      <button type="button" class="toggle" id="btnStrong" aria-pressed="false">強振 OFF</button>
      <button type="button" class="big" id="btnSwing">スイング</button>
    </div>
    <div class="row" id="pitchRow" hidden>
      <div class="ptypes" id="ptypes"></div>
      <button type="button" class="big" id="btnThrow">投げる</button>
    </div>
    <p class="help" id="help"></p>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- constants & helpers ----------
const W = 480, H = 640, F = 780, CAMD = 3, CAMH = 1.6, HZ = 240, S0 = F / CAMD, BALL_R = 0.037;
const ZX = 0.253, ZY0 = 0.47, ZY1 = 1.08;
const FD = "'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif";
const FB = "'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif";
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = Math.random;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const pick = a => a[Math.floor(rnd() * a.length)];
const proj = (x, y, z) => { const s = F / (z + CAMD); return { x: W / 2 + x * s, y: HZ + (CAMH - y) * s, s }; };
const plate = (x, y) => ({ x: W / 2 + x * S0, y: HZ + (CAMH - y) * S0 });
const inZone = (x, y) => Math.abs(x) <= ZX && y >= ZY0 && y <= ZY1;

const RANKS = [[90,'S','#ffcf33'],[80,'A','#ff5f8f'],[70,'B','#ff8a3d'],[60,'C','#f2d43a'],[50,'D','#a6d83b'],[40,'E','#3fc7a0'],[30,'F','#4f9dff'],[0,'G','#9aa3b8']];
const rank = v => RANKS.find(r => v >= r[0]);

const TEAMS = [
  { name: '夕焼けレイヴンズ', short: 'レイヴンズ', ab: 'R', color: '#e4572e', dark: '#7a2412', helmet: '#3a1d14', uni: '#fff4ec', pants: '#efe2d8',
    lineup: [
      { no: 7,  pos: '中', name: '早瀬 真',   meet: 70, power: 38, speed: 86 },
      { no: 4,  pos: '遊', name: '坂口 翼',   meet: 64, power: 40, speed: 72 },
      { no: 9,  pos: '右', name: '藤堂 京介', meet: 77, power: 70, speed: 60 },
      { no: 44, pos: '一', name: '熊谷 剛',   meet: 55, power: 95, speed: 28 },
      { no: 25, pos: '左', name: '志村 徹',   meet: 66, power: 72, speed: 45 },
      { no: 5,  pos: '三', name: '石黒 大輔', meet: 58, power: 61, speed: 50 },
      { no: 3,  pos: '二', name: '森下 陽',   meet: 60, power: 42, speed: 66 },
      { no: 22, pos: '捕', name: '黒田 修',   meet: 48, power: 52, speed: 30 },
      { no: 18, pos: '投', name: '氷室 冬馬', meet: 22, power: 20, speed: 32 }],
    pitcher: { name: '氷室 冬馬', max: 147, ctl: 74, sta: 75, pitches: [['スライダー', 3], ['カーブ', 4], ['フォーク', 2]] } },
  { name: '青空シャークス', short: 'シャークス', ab: 'S', color: '#2f6fe0', dark: '#123a8c', helmet: '#173f8a', uni: '#ffffff', pants: '#eef2fb',
    lineup: [
      { no: 1,  pos: '中', name: '足立 隼',   meet: 72, power: 40, speed: 90 },
      { no: 6,  pos: '二', name: '小森 拓真', meet: 66, power: 35, speed: 70 },
      { no: 8,  pos: '遊', name: '桐生 蓮',   meet: 79, power: 63, speed: 66 },
      { no: 55, pos: '一', name: '大門 力',   meet: 58, power: 93, speed: 30 },
      { no: 31, pos: '三', name: '岩城 豪',   meet: 60, power: 80, speed: 42 },
      { no: 10, pos: '右', name: '南 光太',   meet: 63, power: 58, speed: 56 },
      { no: 2,  pos: '左', name: '吉岡 誠',   meet: 56, power: 50, speed: 62 },
      { no: 27, pos: '捕', name: '内海 健',   meet: 50, power: 46, speed: 35 },
      { no: 11, pos: '投', name: '日向 大地', meet: 30, power: 28, speed: 40 }],
    pitcher: { name: '日向 大地', max: 151, ctl: 66, sta: 80, pitches: [['スライダー', 4], ['フォーク', 3], ['カーブ', 2]] } }
];
const USER = 1; // the player is the home team

const DIFFS = {
  easy:   { label: 'かんたん', ts: 2.3,  cpu: 1.3,  win: 1.25 },
  normal: { label: 'ふつう',   ts: 1.85, cpu: 1.0,  win: 1.0 },
  hard:   { label: 'つよい',   ts: 1.5,  cpu: 0.82, win: 0.9 }
};
const ARROW = { 'ストレート': '↑', 'スライダー': '→', 'カーブ': '↘', 'フォーク': '↓', 'シュート': '←' };
function pitchSpec(type, lv) {
  switch (type) {
    case 'スライダー': return { mul: .89, bx: .07 + .035 * lv, by: -.05, e: 2.6 };
    case 'カーブ':     return { mul: .78, bx: .05 + .025 * lv, by: -(.14 + .055 * lv), e: 2 };
    case 'フォーク':   return { mul: .9,  bx: 0, by: -(.14 + .06 * lv), e: 3.2 };
    case 'シュート':   return { mul: .93, bx: -(.05 + .03 * lv), by: -.04, e: 2.4 };
    default:           return { mul: 1, bx: 0, by: .05, e: 2 };
  }
}
const FIELDERS = [
  { n: 'ピッチャー', dir: 0, r: 18 }, { n: 'キャッチャー', dir: 0, r: -2 },
  { n: 'ファースト', dir: 34, r: 29 }, { n: 'セカンド', dir: 13, r: 40 },
  { n: 'サード', dir: -34, r: 29 },   { n: 'ショート', dir: -13, r: 40 },
  { n: 'レフト', dir: -28, r: 86 },   { n: 'センター', dir: 0, r: 96 }, { n: 'ライト', dir: 28, r: 86 }
];
const fence = dir => 98 + 24 * (1 - Math.abs(dir) / 45);

// ---------- DOM ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const elTitle = $('title'), elOver = $('over'), elDeck = $('deck'), elBatRow = $('batRow'), elPitchRow = $('pitchRow');
const elHelp = $('help'), btnSwing = $('btnSwing'), btnThrow = $('btnThrow'), btnStrong = $('btnStrong'), elPtypes = $('ptypes');
let dpr = 1;
const bg = document.createElement('canvas');

// ---------- state ----------
let G = null;             // serializable game state
let P = null;             // current pitch in flight
let phaseT = 0;
let banner = null, call = null, fieldAnim = null, contactFx = null, swingAnim = null, flash = 0;
let lastPitchInfo = null;
const batCur = { x: 0, y: 0.78 }, aimCur = { x: 0.1, y: 0.7 };
const keys = {};
let soundOn = true, opt = { innings: 3, diff: 'normal' };

const userBatting = () => G && G.half === USER;
const batTeam = () => G.half, pitTeam = () => 1 - G.half;
const batter = () => TEAMS[batTeam()].lineup[G.order[batTeam()]];
const now = () => performance.now();
function setPhase(ph) { G.phase = ph; phaseT = now(); syncDeck(); }

// ---------- audio ----------
let AC = null, noiseBuf = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && !noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function noise(dur, freq, q, vol, type = 'bandpass', t0 = 0) {
  const a = ac(); if (!a || !soundOn) return;
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); const t = a.currentTime + t0;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.02, dur / 4));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + dur + .05);
}
function tone(f0, f1, dur, vol, type = 'square', t0 = 0) {
  const a = ac(); if (!a || !soundOn) return;
  const o = a.createOscillator(), g = a.createGain(); const t = a.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
const sfx = {
  hit()   { tone(2100, 900, .16, .18, 'square'); tone(3200, 1800, .1, .08, 'triangle'); noise(.08, 2500, 1, .5, 'highpass'); },
  foul()  { tone(1500, 700, .1, .1, 'square'); noise(.05, 2000, 1, .3, 'highpass'); },
  mitt()  { noise(.09, 900, 2, .6); tone(180, 90, .08, .2, 'sine'); },
  swing() { noise(.18, 700, .8, .25); },
  cheer() { noise(1.6, 1100, .4, .25); noise(1.2, 2200, .5, .12, 'bandpass', .15); },
  ump()   { tone(330, 300, .22, .08, 'sawtooth'); },
  bell()  { tone(880, 880, .12, .1, 'triangle'); tone(1320, 1320, .25, .1, 'triangle', .12); }
};

// ---------- background (static stadium) ----------
function buildBg() {
  bg.width = W * dpr; bg.height = H * dpr;
  const b = bg.getContext('2d'); b.setTransform(dpr, 0, 0, dpr, 0, 0);
  // night sky
  let g = b.createLinearGradient(0, 0, 0, 140); g.addColorStop(0, '#060d24'); g.addColorStop(1, '#1b2e6a');
  b.fillStyle = g; b.fillRect(0, 0, W, 150);
  // light towers
  for (const lx of [36, W - 36]) {
    const rg = b.createRadialGradient(lx, 40, 2, lx, 40, 120); rg.addColorStop(0, 'rgba(255,250,220,.55)'); rg.addColorStop(1, 'rgba(255,250,220,0)');
    b.fillStyle = rg; b.fillRect(lx - 120, 0, 240, 170);
    b.fillStyle = '#fffbe6'; for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) b.fillRect(lx - 16 + i * 8, 28 + j * 7, 6, 5);
    b.fillStyle = '#2a3a70'; b.fillRect(lx - 2, 50, 4, 80);
  }
  // stands with crowd
  b.fillStyle = '#18234f'; b.fillRect(0, 118, W, 108);
  const crowd = ['#e4572e', '#2f6fe0', '#ffffff', '#ffd23f', '#9fb0de', '#f28fb0', '#5ec0a0'];
  for (let y = 124; y < 222; y += 6) {
    const shade = 0.45 + (y - 124) / 100 * 0.55;
    for (let x = (y / 6 % 2) * 3; x < W; x += 7) {
      const leftHome = x > W / 2 ? 1 : 0; // home crowd sits right of the screen
      const c = rnd() < 0.55 ? (leftHome ? '#2f6fe0' : '#e4572e') : pick(crowd);
      b.globalAlpha = shade * (0.6 + rnd() * 0.4); b.fillStyle = c; b.fillRect(x, y, 4, 4);
    }
  }
  b.globalAlpha = 1;
  // center scoreboard
  b.fillStyle = '#0a1230'; b.fillRect(170, 62, 140, 56); b.strokeStyle = '#ffd23f'; b.lineWidth = 2; b.strokeRect(170, 62, 140, 56);
  b.fillStyle = '#ffd23f'; b.font = `18px ${FD}`; b.textAlign = 'center'; b.fillText('全力スタジアム', 240, 88);
  b.fillStyle = '#9fb0de'; b.font = `700 10px ${FB}`; b.fillText('ZENRYOKU STADIUM', 240, 106);
  b.fillStyle = '#2a3a70'; b.fillRect(236, 118, 8, 6);
  // outfield wall
  const wB = proj(0, 0, 120).y, wT = proj(0, 4, 120).y;
  b.fillStyle = '#1d5a3a'; b.fillRect(0, wT, W, wB - wT);
  b.fillStyle = '#ffd23f'; b.fillRect(0, wT, W, 2);
  b.fillStyle = 'rgba(255,255,255,.85)'; b.font = `700 11px ${FB}`; b.fillText('122m', 240, wB - 8);
  // grass stripes
  for (let z = 120, i = 0; z > -1; z -= 6, i++) {
    const y0 = proj(0, 0, z).y, y1 = proj(0, 0, Math.max(z - 6, -1)).y;
    b.fillStyle = i % 2 ? '#2f9a46' : '#36a84f'; b.fillRect(0, y0, W, y1 - y0 + 1);
  }
  const poly = (pts, fill) => { b.beginPath(); pts.forEach((p, i) => { const q = proj(p[0], 0, p[1]); i ? b.lineTo(q.x, q.y) : b.moveTo(q.x, q.y); }); b.closePath(); b.fillStyle = fill; b.fill(); };
  const circ = (cx, cz, r, n = 48) => { const a = []; for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2; a.push([cx + Math.sin(t) * r, Math.max(-.6, cz + Math.cos(t) * r)]); } return a; };
  poly(circ(0, 18.44, 29, 72), '#c98d55');
  poly([[0, 4], [15.5, 19.4], [0, 34], [-15.5, 19.4]], '#34a24c');
  poly(circ(0, 18.44, 2.75), '#d79d64');
  poly(circ(0, 0, 4), '#c98d55');

  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(16, 96, 140, 8);
  const sta = G.sta[pt]; ctx.fillStyle = sta > 50 ? '#3fd36b' : sta > 25 ? '#ffd23f' : '#ff4d5e'; ctx.fillRect(16, 96, 140 * sta / 100, 8);
  // last pitch speed
  const info = (P && P.release && (G.phase === 'pitch' || G.phase === 'contact')) ? { type: P.type, kmh: P.kmh } : lastPitchInfo;
  if (info && G.phase !== 'field') {
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.font = `26px ${FD}`; ctx.lineWidth = 5; ctx.strokeStyle = '#0c1736'; ctx.strokeText(`${info.kmh}`, W - 44, 172); ctx.fillStyle = '#fff'; ctx.fillText(`${info.kmh}`, W - 44, 172);
    ctx.font = `800 12px ${FB}`; ctx.fillStyle = '#ffd23f'; ctx.fillText('km/h', W - 10, 172);
    ctx.strokeText(info.type, W - 10, 192); ctx.fillStyle = '#fff'; ctx.fillText(info.type, W - 10, 192);
  }
  // bottom panel: batter card + commentary
  ctx.fillStyle = 'rgba(8,14,38,.9)'; ctx.fillRect(0, 584, W, 56);
  ctx.fillStyle = TEAMS[batTeam()].color; ctx.fillRect(0, 584, 5, 56);
  const b = batter(), st = G.stats[batTeam()][G.order[batTeam()]];
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = '#9fb0de'; ctx.font = `700 11px ${FB}`; ctx.fillText(`${G.order[batTeam()] + 1}番 ${b.pos}`, 14, 600);
  ctx.fillStyle = '#fff'; ctx.font = `800 15px ${FB}`; ctx.fillText(b.name, 60, 600);
  let x = 160;
  for (const [lab, v] of [['ミート', b.meet], ['パワー', b.power], ['走力', b.speed]]) {
    const r = rank(v);
    ctx.fillStyle = '#9fb0de'; ctx.font = `700 10px ${FB}`; ctx.fillText(lab, x, 600);
    const lw = ctx.measureText(lab).width + 4;
    ctx.fillStyle = r[2]; rr(x + lw, 591, 18, 18, 4); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.font = `13px ${FD}`; ctx.textAlign = 'center'; ctx.fillText(r[1], x + lw + 9, 601);
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = `700 11px ${FB}`; ctx.fillText(String(v), x + lw + 21, 600);
    x += lw + 46;
  }
  ctx.textAlign = 'right'; ctx.fillStyle = '#9fb0de'; ctx.font = `700 10px ${FB}`; ctx.fillText(`${st.ab}-${st.h}`, W - 10, 600);
  ctx.textAlign = 'left'; ctx.fillStyle = '#ffe9a8'; ctx.font = `700 13px ${FB}`;
  ctx.fillText('実況', 14, 624); ctx.fillStyle = '#fff'; ctx.fillText(G.comment, 50, 624, W - 62);
  if (userBatting() && G.strong && G.phase !== 'field') {
    ctx.fillStyle = '#ff4d5e'; rr(8, 118, 54, 22, 6); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = `13px ${FD}`; ctx.textAlign = 'center'; ctx.fillText('強振', 35, 130);
  }
  if (flash && t - flash < 120) { ctx.fillStyle = `rgba(255,255,255,${.5 * (1 - (t - flash) / 120)})`; ctx.fillRect(0, 0, W, H); }
}
function drawBanner(t) {
  if (!banner) return;
  const k = (t - banner.t0) / banner.dur; if (k > 1) { banner = null; return; }
  const pop = RM ? 1 : k < .12 ? 0.6 + k / .12 * 0.55 : k < .2 ? 1.15 - (k - .12) / .08 * .15 : 1;
  const alpha = k > .85 ? 1 - (k - .85) / .15 : 1;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(W / 2, 300); ctx.scale(pop, pop); ctx.transform(1, 0, -0.18, 1, 0, 0);
  ctx.fillStyle = 'rgba(8,14,38,.65)'; ctx.fillRect(-W, -46, W * 2, banner.sub ? 92 : 70);
  ctx.font = `${banner.text.length > 7 ? 38 : 48}px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 10; ctx.strokeStyle = '#0c1736'; ctx.strokeText(banner.text, 4, -8);
  ctx.fillStyle = '#e8364a'; ctx.fillText(banner.text, 4, -4);
  ctx.fillStyle = banner.color; ctx.fillText(banner.text, 0, -8);
  if (banner.sub) { ctx.font = `800 16px ${FB}`; ctx.fillStyle = '#fff'; ctx.fillText(banner.sub, 0, 30); }
  ctx.restore();
}

// ---------- deck / input ----------
function buildPitchButtons() {
  elPtypes.innerHTML = '';
  pitchList(USER).forEach(([type, lv], i) => {
    const b = document.createElement('button'); b.type = 'button'; b.id = 'pt' + i;
    b.innerHTML = `${type}${lv ? `<small>${ARROW[type]}${lv}</small>` : ''}`;
    b.title = `キー ${i + 1}`;
    b.onclick = () => { G.sel = i; syncDeck(); };
    elPtypes.appendChild(b);
  });
}
function syncDeck() {
  if (!G || G.phase === 'over') { elDeck.hidden = true; return; }
  elDeck.hidden = false;
  const ub = userBatting();
  elBatRow.hidden = !ub; elPitchRow.hidden = ub;
  btnStrong.setAttribute('aria-pressed', String(G.strong)); btnStrong.textContent = G.strong ? '強振 ON' : '強振 OFF';
  btnSwing.disabled = !(G.phase === 'windup' || G.phase === 'pitch' || G.phase === 'ready');
  btnThrow.disabled = G.phase !== 'aim';
  [...elPtypes.children].forEach((b, i) => b.setAttribute('aria-pressed', String(i === G.sel)));
  elHelp.textContent = ub
    ? 'カーソルをボールに重ねてタイミングよくスイング。芯（中心）で捉えると強い打球に。カーソルの上側で打つとゴロ、下側で打つとフライ。'
    : '球種を選び、ミットの位置を狙って投げる。コントロールがぶれることも。同じ球種・同じコースばかりだと打たれやすい。';
}
function action() { if (!G) return; if (userBatting()) userSwing(); else userThrow(); }
btnSwing.addEventListener('pointerdown', e => { e.preventDefault(); ac(); userSwing(); });
btnSwing.addEventListener('keydown', e => { if (e.key === 'Enter') userSwing(); });
btnThrow.addEventListener('click', () => { ac(); userThrow(); });
btnStrong.addEventListener('click', () => { if (G) { G.strong = !G.strong; syncDeck(); } });
$('btnSound').addEventListener('click', e => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', String(soundOn)); e.currentTarget.textContent = soundOn ? '音 ON' : '音 OFF'; });

let drag = null;
function canvasPt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointermove', e => {
  if (!G) return;
  const p = canvasPt(e), c = userBatting() ? batCur : aimCur;
  if (e.pointerType === 'mouse') { c.x = (p.x - W / 2) / S0; c.y = CAMH - (p.y - HZ) / S0; }
  else if (drag) { c.x += (p.x - drag.x) / S0 * 1.4; c.y -= (p.y - drag.y) / S0 * 1.4; drag = p; }
  clampCur();
});
cv.addEventListener('pointerdown', e => {
  ac();
  if (e.pointerType === 'mouse') { if (e.button === 0) action(); }
  else { drag = canvasPt(e); try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
});
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => {
  if (!G || G.phase === 'over') return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (e.repeat && (k === ' ' || k === 'Enter' || k === 'j')) return;
  keys[k] = true;
  if (k === ' ' || k === 'j' || (k === 'Enter' && document.activeElement === document.body)) { ac(); action(); }
  if (k === 'Shift' || k === 'k') { G.strong = !G.strong; syncDeck(); }
  if (/^[1-4]$/.test(k) && !userBatting()) { const i = +k - 1; if (i < pitchList(USER).length) { G.sel = i; syncDeck(); } }
});
addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });

// title options
function segment(id, key, parse) {
  const box = $(id);
  box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    opt[key] = parse(b.dataset.v);
    box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
}
segment('optInn', 'innings', Number); segment('optDiff', 'diff', String);
$('btnPlay').addEventListener('click', () => { ac(); elTitle.hidden = true; newGame(); });

// ---------- main loop ----------
let last = now();
function loop(t) {
  const dt = Math.min(t - last, 50); last = t;
  update(t, dt); render(t);
  requestAnimationFrame(loop);
}
function start(data) {
  fit();
  if (data && data.G && data.G.phase && data.G.phase !== 'over') {
    G = data.G; opt.innings = G.innings; opt.diff = G.diff; elTitle.hidden = true; buildPitchButtons();
    P = null; startHalfResume();
  }
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`20px ${FD}`), document.fonts.load(`700 12px ${FB}`)]).then(buildBg, () => {});
  requestAnimationFrame(loop);
}
function startHalfResume() { G.comment = '試合再開！'; fieldAnim = null; announceBatter(); nextPitchPhase(); }
addEventListener('resize', () => { const d = Math.min(window.devicePixelRatio || 1, 2.5); if (d !== dpr) fit(); });
window.claude?.hot?.snapshot?.(() => ({ G: G && G.phase !== 'over' ? JSON.parse(JSON.stringify(G)) : null }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
